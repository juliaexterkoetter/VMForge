name: Testes automatizados do VMForge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar projeto para testes
        run: python -m pip install -e .
      - name: Confirmar ferramenta de integração
        run: python -c "from vmforge.extraction import sevenzip_path; print(sevenzip_path())"
      - name: Verificar sintaxe
        run: python -m compileall -q vmforge
      - name: Executar testes automatizados
        run: python -B -m unittest discover -s tests -v
      - name: Testar também pelo Git Bash
        if: runner.os == 'Windows'
        shell: bash
        run: python -B -m unittest discover -s tests -q
      - name: Construir wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Validar wheel em ambiente isolado
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import tempfile
          import venv
          wheels = list(pathlib.Path('dist').glob('vmforge_cli-*.whl'))
          assert len(wheels) == 1, wheels
          with tempfile.TemporaryDirectory(prefix='vmforge-package-') as directory:
              root = pathlib.Path(directory)
              venv.create(root, with_pip=True)
              python = root / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheels[0].resolve())], check=True)
              subprocess.run([str(python), '-m', 'pip', 'check'], check=True)
              subprocess.run([str(python), '-I', '-m', 'vmforge', '--version'], cwd=root, check=True)
              subprocess.run([str(python), '-I', '-m', 'vmforge', 'create', '--help'], cwd=root, check=True)
              subprocess.run([str(python), '-I', '-c', 'import vmforge; from importlib.metadata import version; assert vmforge.__version__ == version("vmforge-cli")'], cwd=root, check=True)
