[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmforge-cli"
version = "0.2.0rc1"
description = "CLI to configure VirtualBox Kali lab VMs through a keyboard-friendly wizard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["paramiko>=3.4,<5"]
authors = [{name = "Júlia Schaden Exterkoetter"}]

[project.scripts]
vmforge = "vmforge.cli:main"

[tool.setuptools.packages.find]
include = ["vmforge*"]
